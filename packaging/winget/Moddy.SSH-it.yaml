# winget manifest draft. Fill PackageVersion + InstallerSha256 from build-release.ps1, then:
#   winget install --manifest packaging\winget\Moddy.SSH-it.yaml
# Submit to winget-pkgs only after the release is signed and installed once by hand.
PackageIdentifier: Moddy.SSH-it
PackageVersion: 1.0.31
PackageLocale: en-US
Publisher: Moddy
PublisherUrl: https://moddys.net
PackageName: SSH-it
License: MIT
ShortDescription: A native Windows SSH client that drives the real OpenSSH client.
Description: SSH-it runs ssh.exe under a ConPTY, so agent keys, FIDO, ProxyJump and ssh_config behave exactly as in a terminal, and adds command blocks, a signed evidence chain, SFTP with mirror and resume, tunnels, workspaces, colour tags and an agent/CLI surface.
Tags: [ ssh, terminal, sftp, remote ]
InstallerType: inno
Scope: user
InstallModes: [ interactive, silent ]
Installers:
  - Architecture: x64
    InstallerUrl: https://moddys.net/downloads/SSH-it-Setup-1.0.31.exe
    InstallerSha256: REPLACE_WITH_SHA256
ManifestType: singleton
ManifestVersion: 1.6.0
